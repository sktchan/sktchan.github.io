# Builds the site with Jekyll 4 and publishes it to GitHub Pages.
#
# ONE-TIME SETUP: in the repo on github.com go to
#   Settings → Pages → Build and deployment → Source → "GitHub Actions"
# Until that is switched over, pushes will build here but not go live.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you re-run a deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true      # installs gems and caches them between runs

      - uses: actions/configure-pages@v5

      # The CV is a PDF built from cv/cv.tex, which is itself generated from
      # _data/cv.yml and _data/research.yml. Both steps run BEFORE the Jekyll
      # build, because the PDF has to exist in assets/docs/ for Jekyll to copy
      # it into _site.
      - name: Regenerate cv.tex from the data files
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/build-cv.py

      - name: Compile the CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv

      - name: Publish the CV into the site
        run: |
          mkdir -p assets/docs
          mv cv/cv.pdf assets/docs/cv.pdf
          ls -l assets/docs/cv.pdf

      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
