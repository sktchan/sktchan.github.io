# ─── site ────────────────────────────────────────────────────────────────────
title: Serena Chan
tagline: computational biology + machine learning
description: >-
  Serena Chan is an MSc student in computer science at Université de Montréal,
  affiliated with Mila and IRIC, working on representation learning for
  transcriptomics.
author: Serena Chan

# Every form of your name gets bolded automatically inside author lists, so you
# stand out whichever citation style a venue uses. Longest first — otherwise
# "Chan S" would match inside "Chan Serena" and mangle it.
author_forms:
  - "Serena Chan"
  - "Chan Serena"
  - "S. Chan"
  - "Chan S"

url: https://sktchan.github.io
baseurl: ""
lang: en

# ─── build ───────────────────────────────────────────────────────────────────
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

# Pages get clean URLs (/research/ rather than /research.html)
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - vendor/
  - .bundle/
# assets/fonts/LICENSE.md is deliberately NOT excluded — the OFL asks that the
# licence travel with the font files, and the site serves those .woff2s.

# ─── navigation ──────────────────────────────────────────────────────────────
# Reorder or comment out a line to change the nav. `url` must match the page's
# permalink exactly (trailing slash included) for the active state to light up.
nav:
  - title: home
    url: /
  - title: work
    url: /work/
  - title: community
    url: /community/
  - title: cv
    url: /cv/
  - title: photos
    url: /photos/
