{%- comment -%}
  One community tile: a square photo with the institute and role over it.

  Usage:  {% include community-tile.html item=item %}

  The label is a real <figcaption> that is ALWAYS in the DOM — screen readers and
  search engines get it regardless of hover. CSS fades it in on hover for pointer
  users, and keeps it permanently visible where hover doesn't exist (touch) or
  where there is no photo yet, so the page is never a grid of blank squares.

  Tiles are not links or buttons: nothing happens on click, by design.

  `note` is deliberately not rendered — it stays in _data/community.yml if the
  descriptions are ever wanted back.
{%- endcomment -%}

{%- assign item = include.item -%}
{%- assign label = item.venue | default: item.title -%}

<figure class="tile {% unless item.photo and item.photo != '' %}tile--no-photo{% endunless %}">
  {%- comment -%} `!= ''` — an empty string is truthy in Liquid. {%- endcomment -%}
  {%- if item.photo and item.photo != '' -%}
    <img class="tile__img"
         src="{{ item.photo | relative_url }}"
         alt="{{ label | escape }}"
         loading="lazy"
         decoding="async">
  {%- else -%}
    {%- comment -%} Placeholder wash until a photo is dropped in. {%- endcomment -%}
    <span class="tile__img tile__img--empty" aria-hidden="true"></span>
  {%- endif -%}

  <figcaption class="tile__label">
    <span class="tile__where">{{ label }}</span>
    {%- if item.venue and item.title != item.venue -%}
      <span class="tile__role">{{ item.title }}</span>
    {%- endif -%}
  </figcaption>
</figure>
