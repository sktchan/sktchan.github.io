# The photo gallery.
#
# Workflow for new photos: drop full-size originals in photos-originals/
# (git-ignored), run ./scripts/resize-photos.sh, then add an entry here.
#
# `alt` is what a blind visitor and Google both read — it describes what's in
# the frame. `caption` is yours to write: place, year, or whatever you want to
# say about the shot. Add a `caption:` line to any entry and it appears below
# the image; leave it out and the photo stands alone.
#
# Ordered for how the masonry grid looks rather than chronologically.

