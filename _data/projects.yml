- title: "Brain tumor classification in MRI scans"
  role: "Prof: Dr. Erik Sorensen, McMaster University"
  year: "Jan 2024 – Apr 2024"
  note: >-
    Built an image processing pipeline with data augmentation and standard
    normalization for multi-modal MRI datasets, then trained a CNN in TensorFlow
    to classify four distinct tumor types.
  tags: ["TensorFlow", "CNN", "medical imaging"]
  links:
    - name: "code"
      url: "https://github.com/sktchan/tumor-classification"

- title: "OSMS for head and neck radiation therapy"
  role: "Supervisor: Dr. Orest Ostapiak, Juravinski Cancer Centre"
  year: "Sep 2023 – Apr 2024"
  note: >-
    Evaluated immobilization systems for minimizing 6D interfractional and
    intrafractional motion, and benchmarked AlignRT optical surface monitoring
    against cone-beam CT image registration.
  tags: ["radiation oncology", "image registration"]
  links:
    - name: "report (pdf)"
      url: "/assets/docs/osms-report.pdf"
    - name: "code"
      url: "https://github.com/sktchan/alignRT-preprocessing"

- title: "Housing insecurity and the HPA axis in children"
  role: "Supervisor: Dr. Krysta Andrews, Offord Centre for Child Studies"
  year: "Sep 2022 – Apr 2023"
  note: >-
    A systematic review of how socioenvironmental housing instability affects HPA
    axis functioning in children, alongside analysis of salivary cortisol data
    linking housing quality to long-term neuroendocrine stress dysregulation.
  tags: ["systematic review", "biomarkers"]
  links:
    - name: "poster (pdf)"
      url: "/assets/docs/hpa-poster.pdf"
