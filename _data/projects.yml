# Additional projects — coursework and side work. Selected work lives in
# research.yml.
#
# `gallery` is optional but currently unused: rows are flat, so there is nowhere
# to render one. The PyMOL entries are kept in case galleries come back.

- id: "protein-embeddings"
  title: "Protein embeddings and local alignments"
  role: "Prof: Dr. Nadia El-Mabrouk, Université de Montréal"
  year: "Sep 2025 – Dec 2025"
  note: >-
    A review of protein language model embeddings and cosine similarity scoring
    inside Smith-Waterman dynamic programming, weighed against traditional
    BLOSUM substitution matrices.
  links:
    - name: "Slides (PDF)"
      url: "/assets/docs/alignments-slides.pdf"

- id: "energy-forecasting"
  title: "Energy consumption prediction"
  role: "Prof: Dr. Vincent Taboga, Mila — Quebec AI Institute"
  year: "Jan 2025 – Apr 2025"
  note: >-
    Engineered multi-horizon time-series features — cyclical time
    representations, wind chill, heat indices — and trained LSTM networks in
    PyTorch to forecast building power demand.
  links:
    - name: "Code"
      url: "https://github.com/sktchan/energy-forecasting"

- id: "viral-rna"
  title: "Structural visualization of viral RNA complexes"
  role: "Prof: Dr. François Major, Université de Montréal"
  year: "Jan 2025 – Apr 2025"
  note: >-
    Rendered 3D structural models in PyMOL to analyze base-pairing in the West
    Nile Virus 5′ UTR stem-loop B, and hydrogen bonding in the H7N1 NS1
    RNA-binding domain.
  links:
    - name: "Report (PDF)"
      url: "/assets/docs/pymol-report.pdf"

- id: "tumor-mri"
  title: "Brain tumor classification in MRI scans"
  role: "Prof: Dr. Erik Sorensen, McMaster University"
  year: "Jan 2024 – Apr 2024"
  note: >-
    Built an image processing pipeline with data augmentation and standard
    normalization for multi-modal MRI datasets, then trained a CNN in TensorFlow
    to classify four distinct tumor types.
  links:
    - name: "Code"
      url: "https://github.com/sktchan/tumor-classification"

- id: "hpa-axis"
  title: "Housing insecurity and the HPA axis in children"
  role: "Supervisor: Dr. Krysta Andrews, Offord Centre for Child Studies"
  year: "Sep 2022 – Apr 2023"
  note: >-
    A systematic review of how socioenvironmental housing instability affects
    HPA axis functioning in children, alongside analysis of salivary cortisol
    data linking housing quality to long-term neuroendocrine stress
    dysregulation.
  links:
    - name: "Poster (PDF)"
      url: "/assets/docs/hpa-poster.pdf"
