# Research projects and software, newest first. Rendered as cards on /projects/.
#
# `gallery` is optional — a list of {file, alt} under assets/img/projects/,
# rendered as a small lightbox gallery beneath the card. Only the PyMOL project
# uses it.

- title: "Transcriptomic foundation model tokenization"
  role: "Supervisor: Dr. Sébastien Lemieux, Université de Montréal"
  year: "Jan 2025 – present"
  note: >-
    Building an evaluation framework that varies tokenization, pre-training
    objective and architecture together, to see which combinations actually help
    on downstream perturbation prediction.
  tags: ["Julia", "Flux.jl", "transformers", "transcriptomics"]
  links:
    - name: "code"
      url: "https://github.com/lemieux-lab/LTformers"

- title: "Protein embeddings and local alignments"
  role: "Prof: Dr. Nadia El-Mabrouk, Université de Montréal"
  year: "Sep 2025 – Dec 2025"
  note: >-
    A review of protein language model embeddings and cosine similarity scoring
    inside Smith-Waterman dynamic programming, weighed against traditional
    BLOSUM substitution matrices.
  tags: ["protein language models", "sequence alignment"]
  links:
    - name: "slides (pdf)"
      url: "/assets/docs/alignments-slides.pdf"

- title: "Energy consumption prediction"
  role: "Prof: Dr. Vincent Taboga, Mila — Quebec AI Institute"
  year: "Jan 2025 – Apr 2025"
  note: >-
    Engineered multi-horizon time-series features — cyclical time
    representations, wind chill, heat indices — and trained LSTM networks in
    PyTorch to forecast building power demand.
  tags: ["PyTorch", "LSTM", "time series"]
  links:
    - name: "code"
      url: "https://github.com/sktchan/energy-forecasting"

- title: "Computational design of anti-aptamers"
  role: "Prof: Dr. François Major, Université de Montréal"
  year: "Jan 2025 – Apr 2025"
  note: >-
    Designed single-loop and bivalent DNA antidotes to neutralize the SARS-CoV-2
    CoV2-6C3 RNA aptamer using mfold and RNAfold, then simulated hybridization
    and competitive inhibition with NUPACK thermodynamics and HDOCK docking.
  tags: ["RNA structure", "NUPACK", "molecular docking"]
  links:
    - name: "report (pdf)"
      url: "/assets/docs/aptamers-report.pdf"
    - name: "code"
      url: "https://github.com/sktchan/anti-aptamers"

