# Workshops, leadership and volunteering, and mentorship — the Community
# section on the home page. Any group you empty out disappears.
#
# A row shows `venue` as the lead line, with `title` (the role), `year` and
# `location` beneath. Workshops have no venue, year or location — their title
# leads and their links sit beside it.
#
# `note:` is what the ribbon reveals when a row is hovered or focused, so it
# carries real weight now — keep them to a sentence or two.
#
# Talks live in research.yml, next to the work they're about.
#
# ─── timeline geometry ───────────────────────────────────────────────────────
# `start` / `end` are the real dates ("YYYY-MM", or "present" for anything still
# running) and are the source of truth. `x` / `w` are the bar's left edge and
# width as percentages of the ribbon, and are GENERATED — don't hand-edit them.
#
#     ./scripts/timeline.sh        # prints new x/w and a new axis: block
#
# They're baked in because Liquid has no date arithmetic and can't work out bar
# positions at render time. Because "present" resolves to whenever the script
# last ran, every number drifts a little on each run; that's expected.
#
# The axis is piecewise-linear and scale-preserving. Stretches where nothing at
# all was running collapse to a fixed sliver drawn as a visible break, while
# every live stretch shares one %-per-month rate — so a two-year role is the
# same width wherever it falls. There are currently two such breaks: the nine
# months between St. Joseph's ending and the CSA role starting, and the whole
# of 2024 once STEM Fellowship stopped being open-ended - it was the only entry
# that spanned that year, so giving it an end date opened a hole behind it.
#
# The home page merges leadership and mentorship into one ribbon and draws every
# bar the same way. The two groups below are kept only because they're a handy
# way to edit this file — nothing rendered depends on which one an entry is in.
#
# ─── retired map coordinates ─────────────────────────────────────────────────
# `map_x` / `map_y` positioned dots on the old inline-SVG map, which the ribbon
# replaced. Nothing reads them any more. They're kept in case the map ever comes
# back — two entries never had them, which is why those two never appeared on it.
#
# ERNESTINE'S IS DELIBERATELY IMPRECISE — it sat at Toronto centre, not at its
# real address. Women's shelters keep their locations confidential for resident
# safety. Please don't "correct" this.

intro: >-
  Some time I spent with others, for others, and everything in between.

# ─── workshops you've run ────────────────────────────────────────────────────
# Slides live in assets/docs/; code lives in github.com/sktchan/lab-demos, deep
# linked to the folder for each workshop.
workshops:
  - title: "CUDA GPU Kernels in Julia"
    photo: "/assets/img/workshops/kernels.jpg"
    note: >-
      Taught the fundamentals of GPU architecture and custom kernel programming,
      covering thread hierarchy, memory synchronization, dynamic shared memory
      and atomic operations.
    links:
      # Slides deliberately not hosted — the source PDF is 11MB, too heavy to
      # serve. The notebook in the repo covers the same material.
      - name: "Code"
        url: "https://github.com/sktchan/lab-demos/tree/main/gpu_opt"

  - title: "Nvidia Nsight Systems Performance Analysis"
    photo: "/assets/img/workshops/nsight.jpg"
    note: >-
      Led a system-wide performance analysis workshop, covering CLI data
      collection with nsys profile, hardware bottleneck identification, and GUI
      timeline visualization across CPU and GPU tasks.
    links:
      - name: "Slides"
        url: "/assets/docs/workshop-nsight.pdf"
      - name: "Code"
        url: "https://github.com/sktchan/lab-demos/tree/main/nsight"

  - title: "Introduction to Quantum Computing"
    photo: "/assets/img/workshops/quantum.jpg"
    note: >-
      Presented the theoretical foundations of quantum mechanics and led a
      practical tutorial on simulating multi-qubit circuits, entanglement and
      state measurements using the Snowflurry.jl framework.
    links:
      - name: "Slides"
        url: "/assets/docs/workshop-quantum.pdf"
      - name: "Code"
        url: "https://github.com/sktchan/lab-demos/tree/main/quantum"

  - title: "Calcul Québec HPC Infrastructure"
    photo: "/assets/img/workshops/calcul-quebec.jpg"
    note: >-
      Facilitated technical onboarding for Calcul Québec's high-performance
      computing clusters (Fir, Narval, Nibi, Rorqual, Trillium), covering SLURM
      job scheduling, reference GPU unit (RGU) allocation and Globus file
      transfers.
    links:
      - name: "Slides"
        url: "/assets/docs/workshop-calcul-quebec.pdf"
      - name: "Code"
        url: "https://github.com/sktchan/lab-demos/tree/main/calcul_quebec"

