# ─── ribbon axis ─────────────────────────────────────────────────────────────
# GENERATED by scripts/timeline.sh alongside the x/w values above — paste both
# at the same time or the ticks will disagree with the bars.
#
# Januaries that land inside a collapsed stretch are deliberately absent; the
# break mark stands in for them.
axis:
  ticks:
    - { label: "2018", x: 4.32 }
    - { label: "2019", x: 17.29 }
    - { label: "2021", x: 36.49 }
    - { label: "2022", x: 49.46 }
    - { label: "2023", x: 62.43 }
    - { label: "2025", x: 78.39 }
    - { label: "2026", x: 91.36 }
  breaks:
    - { x: 29.17, w: 3.00 }   # 9 months, 2019-12 to 2020-08
    - { x: 75.39, w: 3.00 }   # 12 months, 2024-01 to 2024-12

