  - id: "hpa-axis"
    title: "Housing insecurity and the HPA axis in children"
    role: "Supervisor: Dr. Krysta Andrews, Offord Centre for Child Studies"
    year: "Sep 2022 – Apr 2023"
    note: >-
      A systematic review of how socioenvironmental housing instability affects
      HPA axis functioning in children, alongside analysis of salivary cortisol
      data linking housing quality to long-term neuroendocrine stress
      dysregulation.
    tags: ["systematic review", "biomarkers"]
    links:
      - name: "poster (pdf)"
        url: "/assets/docs/hpa-poster.pdf"
