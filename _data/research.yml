# ─── the blurb at the top of /research/ ──────────────────────────────────────
statement: >-
  I work on representation learning for transcriptomics — how to turn gene
  expression measurements into representations a model can actually reason over.
  Most of my time goes to benchmarking transformer, autoencoder and feedforward
  architectures against one another, and asking what pre-training objectives and
  input tokenizations genuinely buy you on downstream tasks like perturbation
  prediction. Before this I worked in radiation oncology physics and in child
  health research, which is where the clinical thread in my CV comes from.

