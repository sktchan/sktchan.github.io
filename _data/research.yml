    year: "Feb 2025"
    links:
      - name: "DOI"
        url: "https://doi.org/10.26685/urncst.750"

# ─── selected work ───────────────────────────────────────────────────────────
projects:
  - id: "tokenization"
    title: "Transcriptomic foundation model tokenization"
    role: "Supervisor: Dr. Sébastien Lemieux, Université de Montréal"
    year: "Jan 2025 – present"
    note: >-
      Building an evaluation framework that varies tokenization, pre-training
      objective and architecture together, to see which combinations actually
      help on downstream perturbation prediction.
    links:
      - name: "Code"
        url: "https://github.com/lemieux-lab/LTformers"
    presentations:
      - title: "The limits of transformers for transcriptomic representation learning"
        venue: "ISCB — Intelligent Systems in Molecular Biology, Washington, USA"
        year: "Jul 2026"
      - title: "The limits of transformers for transcriptomic learning"
        venue: "DIRO Scientific Day, Montréal, Canada"
        year: "May 2026"
      - title: "Evaluating input representations and architectures for learning transcriptomic embeddings"
        venue: "IRIC International Symposium, Montréal, Canada"
        year: "Oct 2025"
      - title: "Evaluating input representations and architectures for learning transcriptomic embeddings"
        venue: "IVADO Digital Futures, Montréal, Canada"
        year: "Oct 2025"
      - title: "Evaluating deep learning-based representations for modelling transcriptomic variation and function"
        venue: "IRIC Scientific Day, Montréal, Canada"
        year: "Jun 2025"

  - id: "anti-aptamers"
    title: "Computational design of anti-aptamers"
    role: "Prof: Dr. François Major, Université de Montréal"
    year: "Jan 2025 – Apr 2025"
    note: >-
      Designed single-loop and bivalent DNA antidotes to neutralize the SARS-CoV-2
      CoV2-6C3 RNA aptamer using mfold and RNAfold, then simulated hybridization
      and competitive inhibition with NUPACK thermodynamics and HDOCK docking.
    links:
      - name: "Report"
        url: "/assets/docs/aptamers-report.pdf"
      - name: "Code"
        url: "https://github.com/sktchan/anti-aptamers"

  - id: "osms"
    title: "OSMS for head and neck radiation therapy"
    role: "Supervisor: Dr. Orest Ostapiak, Juravinski Cancer Centre"
    year: "Sep 2023 – Apr 2024"
    note: >-
      Evaluated immobilization systems for minimizing 6D interfractional and
      intrafractional motion, and benchmarked AlignRT optical surface monitoring
      against cone-beam CT image registration.
    links:
      - name: "Report"
        url: "/assets/docs/osms-report.pdf"
      - name: "Code"
        url: "https://github.com/sktchan/alignRT-preprocessing"
    publications:
      - title: "Evaluating Accufix head and neck shoulder immobilization for head and neck radiation therapy"
        authors: "Chan S, Ostapiak O, VanSantvoort T, Chow T"
        venue: "URNCST Journal 9(2)"
        year: "Feb 2025"
        links:
          - name: "DOI"
            url: "https://doi.org/10.26685/urncst.750"
    presentations:
      - title: "Evaluating OSMS and shoulder immobilization for larynx cancer patients"
        venue: "RTi3 Conference, Toronto, Canada"
        year: "Mar 2024"
      - title: "Evaluating OSMS and shoulder immobilization for larynx cancer patients"
        venue: "Canadian Undergraduate Conference on Healthcare (CUCOH), Toronto, Canada"
        year: "Jan 2024"
