# The closing band on the home page — two short lists drawn as two silhouettes:
# the hikes as a ridgeline, the books as a stack of spines.
#
# Deliberately the thinnest file in _data/. A hike is a name, a region and two
# numbers; a book is a title, an author and a cover. Nothing here carries
# links, dates or notes — if an entry starts wanting them, it has outgrown this
# section and belongs in community.yml instead.
#
# ─── covers ──────────────────────────────────────────────────────────────────
# `cover` is a filename in assets/img/books/, at 280px tall — twice the size it
# renders at, the same 2x rule scripts/resize-photos.sh follows for the photo
# strip. They are the publishers' cover art, pulled from Open Library and
# committed rather than hotlinked, because the site makes no third-party
# requests for anything else either.
#
# A book with no `cover` still renders; it just gets a blank plate carrying the
# title, so a new entry is never broken while you go and find the artwork.
#
# ─── ridge geometry ──────────────────────────────────────────────────────────
# `gain` is elevation gain in metres, `distance` round-trip kilometres. Summit
# heights are `gain` normalised against the largest gain in the list, worked
# out in Liquid at render time — unlike the community ribbon there is no
# generator script, because three peaks need no date arithmetic. Add or drop a
# hike and the ridge redraws itself, in the order the entries appear here.
#
# So the numbers are load-bearing: they are the shape. An entry without a
# `gain` would flatten to the baseline rather than fail.
#
# ─── on the figures ──────────────────────────────────────────────────────────
# Your own recorded gain and distance, not a guidebook's. Every one of these
# trails has longer and shorter variants and the published numbers disagree
# wildly between them, so what is here is the day you actually walked.

hikes:
  - name:     "Upper Yosemite"
    region:   "Yosemite National Park, California"
    gain:     987
    distance: 10.8

  - name:     "Nihahi Ridge"
    region:   "Kananaskis, Alberta"
    gain:     717
    distance: 11.72

  - name:     "Iceline"
    region:   "Yoho National Park, British Columbia"
    gain:     965
    distance: 15.96

books:
  - title:  "The Correspondent"
    author: "Virginia Evans"
    cover:  "correspondent.jpg"

  - title:  "Orbital"
    author: "Samantha Harvey"
    cover:  "orbital.jpg"

  - title:  "Klara and the Sun"
    author: "Kazuo Ishiguro"
    cover:  "klara.jpg"
